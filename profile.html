
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Mock Test Attempt</title>
<style>
  body { font-family: Arial; padding: 20px; line-height: 1.6; }
  .question-box {
    border: 1px solid #ddd;
    padding: 15px;
    margin-bottom: 15px;
    border-radius: 6px;
    background: #fafafa;
  }
  .question-title { font-weight: bold; font-size: 18px; }
  select { padding: 5px; font-size: 16px; margin-bottom: 20px; }
  textarea { resize: vertical; }
</style>
</head>
<body>

<h2 id="testTitle">Select a Mock Test</h2>

<select id="mockTestSelect" onchange="loadSelectedTest()">
  <option value="">-- Choose Mock Test --</option>
</select>

<div id="questionsContainer">No questions loaded</div>

<button onclick="submitTest()" style="margin-top:20px; padding:10px;">Submit Test</button>

<script>
const API_URL = "http://localhost:5000/api/mocktests";
const AUTO_SAVE_URL = "http://localhost:5000/api/mocktests/autosave"; // Auto-save endpoint
const userId = "6909a8eb9fce0ecacc696e18"; // working user ID
let mockTestId = "";
let questions = [];
let allTests = [];

// -----------------------------
// FETCH MOCK TESTS
// -----------------------------
async function fetchMockTests() {
  try {
    const res = await fetch(API_URL);
    allTests = await res.json();
    const select = document.getElementById("mockTestSelect");

    allTests.forEach(test => {
      const option = document.createElement("option");
      option.value = test._id;
      option.text = test.title;
      select.add(option);
    });
  } catch (err) {
    console.error("Error fetching mock tests:", err);
  }
}

// -----------------------------
// LOAD SELECTED TEST
// -----------------------------
function loadSelectedTest() {
  const select = document.getElementById("mockTestSelect");
  mockTestId = select.value;

  if (!mockTestId) {
    document.getElementById("questionsContainer").innerHTML = "No questions loaded";
    document.getElementById("testTitle").innerText = "Select a Mock Test";
    return;
  }

  const testData = allTests.find(t => t._id === mockTestId);
  if (!testData) return alert("Test not found");

  questions = testData.questions;
  document.getElementById("testTitle").innerText = testData.title;

  renderQuestions();
}

// -----------------------------
// RENDER QUESTIONS
// -----------------------------
function renderQuestions() {
  const container = document.getElementById("questionsContainer");
  container.innerHTML = "";

  questions.forEach((q, index) => {
    let html = `<div class="question-box" id="qbox_${q._id}">
      <div class="question-title">${index + 1}. ${q.question}</div>`;

    if (q.type === "subjective") {
      html += `<textarea name="q_${q._id}" rows="3" style="width:100%;margin-top:10px;" placeholder="Write your answer here..."></textarea>`;
    } else if (q.type === "multiple-choice") {
      html += "<div style='margin-top:10px;'>";
      q.options.forEach(opt => {
        if (opt.trim() === "") return;
        html += `
          <label>
            <input type="checkbox" name="q_${q._id}" value="${opt}">
            ${opt}
          </label><br>`;
      });
      html += "</div>";
    } else if (q.type === "objective" || q.type === "true-false") {
      html += "<div style='margin-top:10px;'>";
      q.options.forEach(opt => {
        if (opt.trim() === "") return;
        html += `
          <label>
            <input type="radio" name="q_${q._id}" value="${opt}">
            ${opt}
          </label><br>`;
      });
      html += "</div>";
    } else if (q.type === "image-based" && q.images?.length) {
      q.images.forEach(img => {
        html += `<img src="${img.url}" width="200" style="margin-top:10px; display:block;">`;
      });
    }

    html += "</div>";
    container.innerHTML += html;
  });

  // Attach auto-save events
  attachAutoSaveEvents();
}

// -----------------------------
// AUTO-SAVE LOGIC
// -----------------------------
function attachAutoSaveEvents() {
  questions.forEach(q => {
    // Subjective
    if (q.type === "subjective") {
      const textarea = document.querySelector(`textarea[name="q_${q._id}"]`);
      if (textarea) {
        textarea.addEventListener("input", () => autoSave(q._id, textarea.value));
      }
    }

    // Multiple-choice
    if (q.type === "multiple-choice") {
      const checkboxes = document.querySelectorAll(`input[name="q_${q._id}"]`);
      checkboxes.forEach(cb => {
        cb.addEventListener("change", () => {
          const selected = Array.from(checkboxes)
                                .filter(c => c.checked)
                                .map(c => c.value);
          autoSave(q._id, selected);
        });
      });
    }

    // Objective / True-False
    if (q.type === "objective" || q.type === "true-false") {
      const radios = document.querySelectorAll(`input[name="q_${q._id}"]`);
      radios.forEach(r => {
        r.addEventListener("change", () => {
          const selectedRadio = document.querySelector(`input[name="q_${q._id}"]:checked`);
          autoSave(q._id, selectedRadio ? selectedRadio.value : "");
        });
      });
    }
  });
}

// Call autosave API
async function autoSave(questionId, selected) {
  try {
    await fetch(AUTO_SAVE_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mockTestId, userId, questionId, selectedAnswer: selected })
    });
    console.log("Auto-saved:", questionId, selected);
  } catch (err) {
    console.error("Auto-save error:", err);
  }
}

// -----------------------------
// FINAL SUBMIT
// -----------------------------
async function submitTest() {
  if (!mockTestId) return alert("Please select a test first");

  let answers = [];
  questions.forEach(q => {
    let selected;
    if (q.type === "subjective") {
      selected = document.querySelector(`textarea[name="q_${q._id}"]`).value || "";
    } else if (q.type === "multiple-choice") {
      const selectedCheckboxes = document.querySelectorAll(`input[name="q_${q._id}"]:checked`);
      selected = Array.from(selectedCheckboxes).map(cb => cb.value);
    } else {
      const selectedRadio = document.querySelector(`input[name="q_${q._id}"]:checked`);
      selected = selectedRadio ? selectedRadio.value : "";
    }
    answers.push({ questionId: q._id, selected });
  });

  try {
    const response = await fetch(`${API_URL}/submit`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mockTestId, userId, answers })
    });

    const data = await response.json();
    if (response.ok) {
      alert("Test Submitted Successfully!");
      console.log(data);
    } else {
      alert(data.msg);
      console.error(data);
    }
  } catch (err) {
    console.error("Submit Error:", err);
  }
}

// Initial load
fetchMockTests();
</script>

</body>
</html>
